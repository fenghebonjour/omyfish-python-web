networks:
  omyfish-net:
    driver: bridge
  # Created by ../omyfish-ai's compose — start that stack first:
  #   cd ../omyfish-ai && docker compose up -d
  omyfish-shared:
    external: true

volumes:
  postgres_data:
  minio_data:

services:

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: omyfish
      POSTGRES_USER: omyfish
      POSTGRES_PASSWORD: omyfish_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omyfish"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omyfish
      MINIO_ROOT_PASSWORD: omyfish_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [omyfish-net]

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_started }
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 omyfish omyfish_dev; do sleep 1; done;
      mc mb --ignore-existing local/omyfish-images;
      "
    networks: [omyfish-net]

  # Default: NOT started. The shared instance runs from ../omyfish-ai's own
  # compose on the omyfish-shared network. For a self-contained demo without
  # the external instance, run: docker compose --profile bundled up -d
  # (conflicts with the external instance on host port 8000 — run only one).
  ai-service:
    profiles: [bundled]
    build:
      context: ../omyfish-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /checkpoints/best.pt
      CLASSES_PATH: /checkpoints/classes.json
      METADATA_PATH: /metadata/fish_info.json
    volumes:
      - ../omyfish-python/checkpoints:/checkpoints:ro
      - ../omyfish-python/data/metadata:/metadata:ro
    networks: [omyfish-net]

  django:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DEBUG: "false"
      DJANGO_SECRET_KEY: dev-secret-change-in-production
      JWT_SECRET: dev-secret-change-in-production-32b
      DATABASE_URL: postgres://omyfish:omyfish_dev@postgres:5432/omyfish
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: omyfish
      MINIO_SECRET_KEY: omyfish_dev
      MINIO_BUCKET: omyfish-images
      ALLOWED_HOSTS: "*"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      createbuckets: { condition: service_completed_successfully }
    networks: [omyfish-net, omyfish-shared]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/species')"]
      interval: 10s
      retries: 5
      start_period: 20s

  # Extracted to its own repo/image so it can be shared, versioned, and
  # patched once for every omyfish-* backend instead of vendored per-repo —
  # see https://github.com/fenghebonjour/omyfish-frontend. NEXT_PUBLIC_API_URL
  # is baked in at that repo's build time (defaults to :8080, matching every
  # backend's gateway port), not settable here at runtime.
  frontend:
    image: ghcr.io/fenghebonjour/omyfish-frontend:dd75e97
    ports:
      - "3000:3000"
    depends_on:
      django: { condition: service_healthy }
    networks: [omyfish-net]
